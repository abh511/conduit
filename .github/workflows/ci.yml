name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older, now-irrelevant run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      # GitHub's ubuntu runners have Docker, so testcontainers can start real
      # Postgres and Redis for the integration tests.
      - run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build only, to catch Dockerfile breakage early. Pushing to GHCR is added
      # in Phase 6 together with deployment.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: conduit:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
